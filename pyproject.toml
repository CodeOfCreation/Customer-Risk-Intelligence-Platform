[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "customer_risk"
version = "0.0.1"
description = "A production-oriented Machine Learning platform for customer churn and risk prediction, built with Python, Scikit-learn, XGBoost, FastAPI, PostgreSQL, and HTML/CSS/JavaScript"
authors = [
  { name = "Mahadev Shete" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "setuptools<82",
    "tqdm",
    "typer",
    "ydata-profiling>=4.18.4",
]
requires-python = "==3.13.5"


[tool.ruff]
line-length = 99
src = ["customer-risk"]
include = ["pyproject.toml", "customer-risk/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["customer-risk"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

